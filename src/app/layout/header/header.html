<header class="header">
  <a class="header__brand" routerLink="/" aria-label="Умный город — на главную">
    <img class="header__logo" src="assets/icons/logo.svg" alt="" />
    <span class="header__brand-name">Умный город</span>
  </a>

  <nav class="header__navigation header__navigation--desktop" aria-label="Основная навигация">
    <a class="header__link" routerLink="/routes">Маршруты</a>
    <a class="header__link">Создать маршрут</a>
    <a class="header__link">Избранное</a>
  </nav>

  <button class="header__login header__login--desktop" type="button">Войти</button>

  <button
    class="header__menu-toggle"
    type="button"
    [attr.aria-expanded]="isMenuOpen()"
    aria-controls="mobile-navigation"
    [attr.aria-label]="isMenuOpen() ? 'Закрыть меню' : 'Открыть меню'"
    (click)="toggleMenu()"
  >
    <img class="header__menu-icon" src="assets/icons/menu.svg" alt="" />
  </button>

  @if (isMenuOpen()) {
    <div class="header__mobile-menu" id="mobile-navigation">
      <nav class="header__navigation header__navigation--mobile" aria-label="Мобильная навигация">
        <a class="header__link header__link--mobile" routerLink="/routes">Маршруты</a>
        <a class="header__link header__link--mobile"> Создать маршрут </a>
        <a class="header__link header__link--mobile"> Избранное </a>
      </nav>
      <button class="header__login header__login--mobile" type="button">Войти</button>
    </div>
  }
</header>
