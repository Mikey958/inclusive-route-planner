<section class="hero__surface" aria-labelledby="hero-title">
  <div class="hero__content">
    <p class="hero__eyebrow">Городской гид</p>

    <h1 class="hero__title" id="hero-title">
      <span class="hero__title-line">Екатеринбург</span>
      <span class="hero__title-line">шаг за шагом</span>
    </h1>

    <p class="hero__description">
      Выбирайте готовые прогулки или создавайте свои маршруты по интересным местам города.
    </p>

    <div class="hero__actions">
      <app-button>Найти маршрут</app-button>
      <app-button variant="outline" [withSymbol]="true">Создать свой</app-button>
    </div>
  </div>
</section>
