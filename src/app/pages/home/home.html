<main class="home">
  <app-hero />

  <section class="home__routes" aria-labelledby="home-routes-title">
    <div class="home__routes-heading">
      <h2 class="home__routes-title" id="home-routes-title">Подборка маршрутов</h2>
      <a class="home__routes-all" routerLink="/routes">
        Все маршруты
        <span class="home__routes-arrow" aria-hidden="true">→</span>
      </a>
    </div>

    <app-route-card
      [imageUrl]="featuredRoute.imageUrl"
      [imageAlt]="featuredRoute.imageAlt"
      [title]="featuredRoute.title"
      [description]="featuredRoute.description"
      [distanceKm]="featuredRoute.distanceKm"
      [stopsCount]="featuredRoute.stopsCount"
      [tags]="featuredRoute.tags"
      [author]="featuredRoute.author"
      [accessibilityLabel]="featuredRoute.accessibilityLabel"
    />
  </section>

  <app-route-cta />
</main>
